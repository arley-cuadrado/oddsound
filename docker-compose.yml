# Local database only. The app itself runs on the host with `pnpm dev`, which
# needs Node 22 and pnpm 11 — versions the old all-in-one container predated.
#
# The replica set is not optional: Payload's mongoose adapter opens a
# transaction for every write, and standalone MongoDB rejects them on commit.
services:
  mongo:
    image: mongo:7
    # maxTransactionLockRequestTimeoutMillis defaults to 5ms, which is not enough
    # while mongoose is still building indexes on a fresh database: writes fail
    # with "Unable to acquire IX lock". Only affects first boot, but it is fatal.
    command:
      [
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--setParameter',
        'maxTransactionLockRequestTimeoutMillis=5000',
      ]
    ports:
      - '27017:27017'
    volumes:
      - data:/data/db
    healthcheck:
      # Reports healthy once the replica set is up, initiating it on first boot.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (error) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok
        }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  data:
